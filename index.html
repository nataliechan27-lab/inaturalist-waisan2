<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>iNaturalist 觀察地圖</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html, body { margin:0; height:100%; font-family: system-ui, "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  #map { position:absolute; inset:0; background:#eef1f4; }
  #panel {
    position:absolute; top:14px; left:14px; z-index:1000; width:268px;
    background:rgba(255,255,255,.97); border-radius:12px; padding:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.16); font-size:13px; color:#222;
    max-height:calc(100% - 40px); overflow:auto;
  }
  #panel h1 { font-size:15px; margin:0 0 2px; }
  #panel .sub { color:#777; font-size:11px; margin-bottom:12px; }
  .stats { display:flex; gap:8px; margin-bottom:14px; }
  .stat { flex:1; background:#f6f7f9; border-radius:8px; padding:8px; text-align:center; }
  .stat b { display:block; font-size:17px; line-height:1.2; }
  .stat span { font-size:10px; color:#777; }
  .label { font-size:11px; font-weight:600; color:#555; margin:0 0 6px; letter-spacing:.03em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip {
    display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;
    border:1px solid #ddd; background:#fff; border-radius:999px;
    padding:3px 9px 3px 7px; font-size:11px; transition:.12s;
  }
  .chip .dot { width:8px; height:8px; border-radius:50%; }
  .chip.off { opacity:.35; background:#f3f3f3; }
  .chip:hover { border-color:#aaa; }
  select#orderSel {
    width:100%; box-sizing:border-box; padding:6px 8px; margin-bottom:12px;
    border:1px solid #ddd; border-radius:8px; font-size:12px; font-family:inherit; background:#fff;
  }
  input#search {
    width:100%; box-sizing:border-box; padding:7px 9px; margin-bottom:12px;
    border:1px solid #ddd; border-radius:8px; font-size:12px; font-family:inherit;
  }
  input#search:focus, .account input:focus { outline:none; border-color:#8ab4f8; }
  .opt { display:flex; align-items:flex-start; gap:7px; font-size:11px; color:#555; margin-bottom:12px; line-height:1.4; }
  .opt input { margin:2px 0 0; }
  .hint { font-size:10px; color:#999; line-height:1.5; margin:10px 0 0; }

  /* 帳號切換 */
  .account { display:flex; gap:6px; margin-bottom:6px; }
  .account input {
    flex:1; min-width:0; padding:7px 9px; border:1px solid #ddd; border-radius:8px;
    font-size:12px; font-family:inherit;
  }
  .account button {
    flex:none; padding:7px 12px; border:1px solid #1565c0; background:#1565c0; color:#fff;
    border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .account button:hover { background:#0d47a1; }
  .account button:disabled { opacity:.55; cursor:default; }
  .status { font-size:10.5px; color:#8a9096; line-height:1.5; min-height:15px; margin-bottom:12px; }
  .status.live { color:#2e7d32; }
  .status.err { color:#c62828; }

  /* 按鈕列 */
  .btnrow { display:flex; gap:8px; }
  .btnrow button { flex:1; width:auto; padding:7px; border-radius:8px; cursor:pointer; font-size:12px; font-family:inherit; }
  button#wallBtn { border:1px solid #1565c0; background:#1565c0; color:#fff; }
  button#wallBtn:hover { background:#0d47a1; }
  button#drawerBtn { border:1px solid #1565c0; background:#fff; color:#1565c0; }
  button#drawerBtn:hover { background:#eef4fb; }
  button#updateBtn, button#reset { border:1px solid #ddd; background:#fff; }
  button#updateBtn:hover, button#reset:hover { background:#f6f7f9; }
  .btnrow.second { margin-top:8px; }

  .leaflet-popup-content { margin:12px 14px; font-size:12px; }
  .popup-img { width:216px; height:162px; object-fit:cover; border-radius:8px; display:block; margin-bottom:8px; background:#eee; }
  .popup-title { font-size:14px; font-weight:700; }
  .popup-sci { font-style:italic; color:#666; margin-bottom:6px; }
  .popup-meta { color:#555; line-height:1.6; }
  .popup-meta a { color:#1565c0; }
  .leaflet-tooltip { font-size:12px; }
  .leaflet-control-attribution { font-size:10px; }

  /* 照片牆 */
  #wall { position:fixed; inset:0; z-index:2000; background:#f7f8fa; display:flex; flex-direction:column; }
  #wall.hidden { display:none; }
  .wall-head {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 20px; background:rgba(255,255,255,.95);
    border-bottom:1px solid #e5e8eb; backdrop-filter:blur(8px);
  }
  .wall-head .t { font-size:15px; font-weight:700; }
  #wallCount { color:#777; font-size:12px; font-weight:400; margin-left:8px; }
  .wall-actions { display:flex; align-items:center; gap:10px; }
  .wall-tip { color:#999; font-size:11px; }
  #wallClose {
    border:none; background:#f0f2f4; width:32px; height:32px; border-radius:50%;
    cursor:pointer; font-size:15px; color:#444;
  }
  #wallClose:hover { background:#e2e6ea; }
  .wall-body { flex:1; overflow:auto; padding:18px 20px 48px; }
  .wall-body section { margin-bottom:26px; }
  .wall-body h3 {
    font-size:13px; margin:0 0 10px; display:flex; align-items:center; gap:7px; color:#333;
    position:sticky; top:0; background:#f7f8fa; padding:4px 0;
  }
  .wall-body h3 .dot { width:9px; height:9px; border-radius:50%; }
  .wall-body h3 .c { color:#999; font-weight:400; font-size:11px; }
  .wall-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .wall-item {
    position:relative; padding:0; border:none; background:#e9edf0; border-radius:10px;
    overflow:hidden; cursor:zoom-in; aspect-ratio:1/1; font-family:inherit;
  }
  .wall-item img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s ease; }
  .wall-item:hover img { transform:scale(1.07); }
  .wi-cap {
    position:absolute; left:0; right:0; bottom:0; padding:18px 8px 7px; text-align:left;
    background:linear-gradient(transparent, rgba(0,0,0,.74)); color:#fff;
    opacity:0; transition:opacity .18s ease; font-size:11px; line-height:1.35;
  }
  .wall-item:hover .wi-cap { opacity:1; }
  .wi-cap b { display:block; font-size:12px; }
  .wi-cap span { color:#d8dde2; font-size:10px; }

  /* 燈箱 */
  #lightbox { position:fixed; inset:0; z-index:3000; background:rgba(12,14,16,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #lightbox.hidden { display:none; }
  #lbImg { max-width:min(1100px, 92vw); max-height:72vh; object-fit:contain; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.55); background:#1a1d20; }
  #lbMeta { color:#dfe4e8; font-size:13px; text-align:center; margin-top:16px; max-width:min(1100px, 92vw); line-height:1.65; }
  #lbMeta b { color:#fff; font-size:15px; }
  #lbMeta .sci { font-style:italic; color:#aeb6bd; }
  #lbMeta a { color:#8ab4f8; }
  #lbClose, #lbPrev, #lbNext {
    position:absolute; border:none; background:rgba(255,255,255,.12); color:#fff;
    border-radius:50%; cursor:pointer; line-height:1;
  }
  #lbClose { top:18px; right:20px; width:38px; height:38px; font-size:16px; }
  #lbPrev, #lbNext { top:50%; transform:translateY(-50%); width:46px; height:46px; font-size:24px; padding-bottom:3px; }
  #lbPrev { left:18px; }
  #lbNext { right:18px; }
  #lbClose:hover, #lbPrev:hover, #lbNext:hover { background:rgba(255,255,255,.26); }

  /* 滑鼠懸停相片卡 */
  #photoCard {
    position:absolute; z-index:1200; display:block; width:272px; max-width:calc(100vw - 20px);
    background:#fff; border-radius:12px; overflow:hidden; pointer-events:none;
    box-shadow:0 12px 34px rgba(0,0,0,.3);
    opacity:0; transform:translateY(6px) scale(.97);
    transition:opacity .13s ease, transform .13s ease;
  }
  #photoCard.show { opacity:1; transform:none; }
  #photoCard img { display:block; width:100%; max-height:300px; object-fit:cover; background:#e6eaee; }
  #photoCard .pc-body { padding:9px 12px 11px; }
  #photoCard .pc-name { font-size:14px; font-weight:700; line-height:1.3; }
  #photoCard .pc-sci { font-style:italic; color:#666; font-size:11px; margin-top:1px; }
  #photoCard .pc-meta { color:#777; font-size:10.5px; line-height:1.55; margin-top:5px; white-space:pre-line; }
  #photoCard .pc-date { color:#444; font-size:11px; margin-top:4px; }
  #photoCard .pc-link {
    display:inline-block; margin-top:6px; font-size:11px; color:#1565c0;
    text-decoration:none; pointer-events:auto;
  }
  #photoCard .pc-link:hover { text-decoration:underline; }

  /* 右側分析面板 */
  #drawer {
    position:fixed; top:0; right:0; bottom:0; width:min(370px, 100vw);
    background:#fff; z-index:1100; box-shadow:-8px 0 30px rgba(0,0,0,.16);
    transform:translateX(102%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  #drawer.open { transform:none; }
  .dw-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid #e8ebee; }
  .dw-head .t { font-size:15px; font-weight:700; }
  .dw-head .x { border:none; background:#f0f2f4; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; }
  .dw-head .x:hover { background:#e2e6ea; }
  .dw-body { flex:1; overflow:auto; padding:16px 18px 30px; }
  .dw-sec { margin-bottom:26px; }
  .dw-sec h3 { font-size:12px; font-weight:700; color:#333; margin:0 0 4px; }
  .dw-sec .note { font-size:10.5px; color:#999; line-height:1.5; margin:0 0 10px; }

  /* 季節熱圖 */
  .hm { display:grid; grid-template-columns:50px repeat(12, 1fr); gap:2px; }
  .hm .hm-h { text-align:center; color:#999; font-size:8.5px; padding-bottom:2px; }
  .hm .hm-row { color:#555; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:20px; }
  .hm .cell { height:20px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:9px; }
  .hm .cell.zero { background:#f3f5f7; color:#cfd4d9; }
  .hm-legend { display:flex; align-items:center; gap:6px; font-size:9.5px; color:#999; margin-top:8px; }
  .hm-legend .bar { flex:1; height:7px; border-radius:4px; background:linear-gradient(90deg,#eef2f6,#1565c0); }

  /* Treemap */
  .tm-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .tm-toggle { display:flex; border:1px solid #ddd; border-radius:999px; overflow:hidden; flex:none; }
  .tm-toggle button { border:none; background:#fff; padding:3px 11px; font-size:11px; cursor:pointer; font-family:inherit; color:#666; }
  .tm-toggle button.on { background:#1565c0; color:#fff; }
  #treemap { position:relative; width:100%; height:230px; border-radius:8px; overflow:hidden; background:#f4f6f8; }
  .tm-node { position:absolute; box-sizing:border-box; border:1px solid rgba(255,255,255,.85); overflow:hidden; cursor:pointer; }
  .tm-node:hover { filter:brightness(1.1); }
  .tm-node.sel { border:2px solid #111; z-index:2; }
  .tm-node span { display:block; padding:3px 4px; color:#fff; font-size:9.5px; line-height:1.2; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .tm-node span b { display:block; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tm-crumb { font-size:10.5px; color:#777; margin-top:8px; min-height:16px; }

  /* 匯出 / 分享 */
  .dw-actions { display:flex; flex-wrap:wrap; gap:8px; }
  .dw-actions button {
    flex:1 1 45%; padding:7px 10px; border:1px solid #ddd; background:#fff; border-radius:8px;
    cursor:pointer; font-size:11.5px; font-family:inherit;
  }
  .dw-actions button:hover { background:#f6f7f9; }
  #shareBtn { background:#1565c0; border-color:#1565c0; color:#fff; flex:1 1 100%; }
  #shareBtn:hover { background:#0d47a1; }
  .copy-msg { font-size:10.5px; color:#2e7d32; margin-top:6px; min-height:14px; }

  /* 載入遮罩 / 提示 */
  #loading { position:fixed; inset:0; z-index:4000; background:rgba(255,255,255,.72); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
  #loading.hidden { display:none; }
  .load-box { background:#fff; border-radius:14px; padding:22px 26px; width:min(340px, 84vw); box-shadow:0 18px 50px rgba(0,0,0,.22); text-align:center; }
  .load-box .t { font-size:13px; font-weight:600; margin-bottom:12px; }
  .load-bar { height:6px; background:#eef1f4; border-radius:4px; overflow:hidden; }
  .load-bar i { display:block; height:100%; width:0; background:#1565c0; transition:width .2s ease; }
  .load-sub { font-size:11px; color:#999; margin-top:8px; }
  #toast { position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:5000; background:rgba(30,33,36,.92); color:#fff; padding:9px 16px; border-radius:999px; font-size:12px; max-width:80vw; }
  #toast.hidden { display:none; }

  /* Responsive viewport, safe areas, and independently scrolling panels. */
  *, *::before, *::after { box-sizing:border-box; }
  html, body { width:100%; overflow:hidden; }
  body { height:100vh; height:100dvh; }
  #map { position:fixed; }
  #panel {
    top:max(14px, env(safe-area-inset-top)); left:max(14px, env(safe-area-inset-left));
    width:300px; max-width:calc(100% - 28px);
    max-height:calc(100% - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
  .panel-head > div { min-width:0; }
  #panel .sub { margin-bottom:0; overflow-wrap:anywhere; }
  #panelBody { overflow:auto; min-height:0; padding-top:12px; overscroll-behavior:contain; }
  #panelToggle { display:none; flex:none; border:1px solid #ddd; border-radius:8px; background:#f6f7f9; color:#1565c0; font:inherit; padding:8px 10px; cursor:pointer; }
  button, input, select { font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid #8ab4f8; outline-offset:2px; }
  .stat { min-width:0; }
  .status, .popup-title, .popup-meta, #lbMeta, .tm-crumb { overflow-wrap:anywhere; }
  .wall-head, .dw-head { flex-shrink:0; padding-top:max(12px, env(safe-area-inset-top)); }
  .wall-head { padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right)); }
  .wall-head > div:first-child { min-width:0; }
  .wall-actions { flex-shrink:0; }
  .wall-body, .dw-body { min-height:0; overscroll-behavior:contain; padding-bottom:max(30px, env(safe-area-inset-bottom)); }
  #drawer { padding-right:env(safe-area-inset-right); }
  .hm { grid-template-columns:50px repeat(12, minmax(0, 1fr)); }
  #lightbox { padding:max(64px, env(safe-area-inset-top)) max(64px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(64px, env(safe-area-inset-left)); overflow:auto; }
  #lbImg { min-height:0; flex:0 1 auto; max-width:100%; max-height:60vh; max-height:60dvh; }
  #lbMeta { flex-shrink:0; max-width:100%; max-height:25vh; max-height:25dvh; overflow:auto; }
  #lbClose { top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right)); }
  #lbPrev { left:max(8px, env(safe-area-inset-left)); }
  #lbNext { right:max(8px, env(safe-area-inset-right)); }
  .leaflet-top { top:env(safe-area-inset-top); }
  .leaflet-right { right:env(safe-area-inset-right); }
  .leaflet-bottom { bottom:env(safe-area-inset-bottom); }
  .leaflet-popup-content { max-width:calc(100vw - 64px); max-height:55vh; max-height:55dvh; overflow:auto; overflow-wrap:anywhere; }
  .popup-img { max-width:100%; height:auto; aspect-ratio:4/3; }
  .leaflet-control-attribution { max-width:75vw; }
  #toast { top:max(18px, env(safe-area-inset-top)); overflow-wrap:anywhere; }

  @media (max-width:760px), (max-width:1000px) and (max-height:500px) {
    #panel { top:max(8px, env(safe-area-inset-top)); left:max(8px, env(safe-area-inset-left)); width:min(360px, calc(100% - 76px - env(safe-area-inset-left) - env(safe-area-inset-right))); padding:12px; max-height:calc(75vh - 16px); max-height:calc(75dvh - 16px - env(safe-area-inset-top)); }
    #panel h1 { font-size:14px; }
    #panel .sub { font-size:10px; }
    #panelToggle { display:block; }
    #photoCard { max-width:calc(100vw - 20px); }
    #photoCard img { max-height:38vh; max-height:38dvh; }
    #panel.compact #panelBody { display:none; }
    #drawer { width:min(420px, 100%); }
    input#search, .account input, select#orderSel { font-size:16px; min-height:44px; }
    .btnrow button, .account button, .dw-actions button, #panelToggle, .tm-toggle button { min-height:44px; }
    .chip { min-height:44px; font-family:inherit; }
    .opt { min-height:44px; align-items:center; }
    .opt input { width:20px; height:20px; flex-shrink:0; }
    .wall-tip { display:none; }
    .wall-head { padding-left:max(12px, env(safe-area-inset-left)); padding-right:max(12px, env(safe-area-inset-right)); gap:8px; }
    #wallCount { display:block; margin:3px 0 0; }
    .wall-body { padding:12px 12px max(24px, env(safe-area-inset-bottom)); }
    .wall-grid { grid-template-columns:repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap:8px; }
    #wallClose, .dw-head .x, #lbClose { width:44px; height:44px; flex-shrink:0; }
    #lightbox { padding:64px 12px max(70px, calc(56px + env(safe-area-inset-bottom))); }
    #lbImg { max-height:52vh; max-height:52dvh; }
    #lbMeta { margin-top:10px; font-size:12px; max-height:22vh; max-height:22dvh; }
    #lbPrev, #lbNext { top:auto; bottom:max(10px, env(safe-area-inset-bottom)); transform:none; }
    #lbPrev { left:calc(50% - 58px); }
    #lbNext { right:calc(50% - 58px); }
    .leaflet-control-zoom a { width:44px; height:44px; line-height:44px; }
    .leaflet-control-layers-toggle { width:44px; height:44px; }
    .leaflet-control-layers-expanded { max-width:calc(100vw - 24px); }
    .leaflet-control-layers label { min-height:44px; display:flex; align-items:center; }
  }
  @media (hover:none), (pointer:coarse) {
    .wi-cap { opacity:1; }
    .wall-item:hover img { transform:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="panel-head">
    <div><h1>iNaturalist 觀察地圖</h1>
    <div class="sub"><span id="userLabel">@—</span> · research grade · <span id="baseLabel">高德街道</span></div></div>
    <button id="panelToggle" type="button" aria-controls="panelBody" aria-expanded="true">收合</button>
  </div>
  <div id="panelBody">

  <div class="account">
    <input id="userInput" aria-label="iNaturalist 帳號" type="text" placeholder="iNaturalist 帳號" autocomplete="off" spellcheck="false">
    <button id="loadBtn">載入</button>
  </div>
  <div class="status" id="status">載入中…</div>

  <div class="stats">
    <div class="stat"><b id="s-count">-</b><span>筆觀察</span></div>
    <div class="stat"><b id="s-taxa">-</b><span>個物種</span></div>
    <div class="stat"><b id="s-years">-</b><span>年跨度</span></div>
  </div>

  <p class="label">搜尋物種</p>
  <input id="search" aria-label="搜尋物種或地點" type="text" placeholder="中文名、學名或地點…">

  <p class="label">類群篩選</p>
  <div class="chips" id="chips"></div>

  <p class="label">分類（目）</p>
  <select id="orderSel" aria-label="分類（目）"></select>

  <label class="opt">
    <input type="checkbox" id="gcj" checked>
    <span>GCJ-02 座標校正<br><span style="color:#999">高德在中國大陸／香港／澳門／台灣使用 GCJ-02；海外及「淺色底圖」自動使用 WGS84。</span></span>
  </label>

  <label class="opt">
    <input type="checkbox" id="accChk">
    <span>顯示 GPS 精度圈<br><span style="color:#999">依 positional_accuracy 繪出誤差範圍</span></span>
  </label>

  <div class="btnrow">
    <button id="wallBtn">照片牆</button>
    <button id="drawerBtn">分析</button>
  </div>
  <div class="btnrow second">
    <button id="updateBtn">↻ 更新資料</button>
    <button id="reset">重設視圖</button>
  </div>
  <p class="hint">滑鼠移到圓點會浮出照片；手機可直接點圓點。「分析」開啟季節熱圖與分類 Treemap。</p>
  </div>
</div>

<div id="drawer">
  <div class="dw-head">
    <div class="t">資料分析</div>
    <button class="x" id="drawerClose" title="關閉">✕</button>
  </div>
  <div class="dw-body">
    <div class="dw-sec">
      <h3>季節性（月 × 類群）</h3>
      <p class="note" id="hmTotal">—</p>
      <div class="hm" id="heatmap"></div>
      <div class="hm-legend"><span>少</span><span class="bar"></span><span id="hmMax">—</span></div>
    </div>

    <div class="dw-sec">
      <h3>分類組成</h3>
      <div class="tm-head">
        <span class="note" style="margin:0">面積＝觀察筆數</span>
        <div class="tm-toggle">
          <button data-mode="class">綱</button>
          <button data-mode="order" class="on">目</button>
          <button data-mode="family">科</button>
        </div>
      </div>
      <div id="treemap"></div>
      <div class="tm-crumb" id="tmCrumb"></div>
    </div>

    <div class="dw-sec">
      <h3>匯出目前篩選</h3>
      <p class="note" id="expCount">—</p>
      <div class="dw-actions">
        <button id="expCsv">下載 CSV</button>
        <button id="expGeo">下載 GeoJSON</button>
      </div>
    </div>

    <div class="dw-sec">
      <h3>分享視圖</h3>
      <p class="note">連結會記住帳號、篩選、底圖與地圖位置。</p>
      <div class="dw-actions">
        <button id="shareBtn">複製分享連結</button>
      </div>
      <div class="copy-msg" id="copyMsg"></div>
    </div>
  </div>
</div>

<div id="wall" class="hidden">
  <div class="wall-head">
    <div><span class="t">照片牆</span><span id="wallCount"></span></div>
    <div class="wall-actions">
      <span class="wall-tip">點擊照片放大 · ← → 切換 · Esc 關閉</span>
      <button id="wallClose" title="關閉">✕</button>
    </div>
  </div>
  <div class="wall-body" id="wallBody"></div>
</div>

<div id="lightbox" class="hidden">
  <button id="lbPrev" title="上一張">‹</button>
  <button id="lbNext" title="下一張">›</button>
  <button id="lbClose" title="關閉">✕</button>
  <img id="lbImg" alt="">
  <div id="lbMeta"></div>
</div>

<div id="loading" class="hidden">
  <div class="load-box">
    <div class="t" id="loadText">載入中…</div>
    <div class="load-bar"><i id="loadBar"></i></div>
    <div class="load-sub" id="loadSub"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="snapshot.js"></script>
<script src="gcj-region.js"></script>
<script src="app.js"></script>
</body>
</html>
